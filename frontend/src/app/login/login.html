<div class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat">
  
  <div class="absolute inset-0 bg-black/40"></div>
  
  <div class="relative w-full max-w-md mx-4">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20">
      
      <div class="text-center mb-8">
        <h2 class="text-4xl font-bold text-white mb-2">Welcome Back</h2>
        <p class="text-gray-200">Sign in to your account</p>
      </div>
      
      <div *ngIf="message" class="mb-4 p-3 rounded-lg text-center" 
           [class.bg-red-500/20]="isError" 
           [class.bg-green-500/20]="!isError"
           [class.text-red-200]="isError"
           [class.text-green-200]="!isError">
        {{ message }}
      </div>
      
      <form (ngSubmit)="login()" class="space-y-6">
        <div>
          <input type="email" 
                 [(ngModel)]="email"
                 name="email"
                 class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-gray-300"
                 placeholder="Email Address">
        </div>
        
        <div>
          <input type="password" 
                 [(ngModel)]="password"
                 name="password"
                 class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-gray-300"
                 placeholder="Password">
        </div>
        
        <button type="submit" class="w-full bg-white text-gray-800 font-semibold py-3 rounded-lg">
          Sign In
        </button>
        
        <div class="text-center">
          <p class="text-gray-200">
            No account? 
            <a routerLink="/register">Sign Up</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
